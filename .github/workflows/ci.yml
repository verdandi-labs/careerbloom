name: CI

on:
  push:
    branches: [dev, main, refactor/auth-store]
  pull_request:

defaults:
  run:
    working-directory: frontend

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run generate-routes
      - run: bun run tsc --noEmit
      - name: Lint (auto-fix) and check for dirty tree
        run: bun run lint -- --fix && git diff --exit-code --name-only
