name: CI

on:
  push:
    branches: [dev, main]
  pull_request:

defaults:
  run:
    working-directory: frontend

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run generate-routes
      - run: bun run tsc --noEmit
      - run: bun run lint
