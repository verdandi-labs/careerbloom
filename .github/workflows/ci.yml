name: CI

on:
  push:
    branches: [dev, main]
  pull_request:

defaults:
  run:
    working-directory: frontend

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install
      - run: npx tsc --noEmit
      - run: npm run lint
